<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8" fill="none" stroke="context-stroke" stroke-width="2" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F6F4EF"/><rect x="76" y="45" width="32" height="5" rx="2" fill="#087F7B"/><text x="124" y="51.29" fill="#087F7B" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" data-box-x="124" data-box-y="34" data-box-w="1320" data-box-h="28"><tspan x="124" dy="0">08 · STATUS AND NEXT STEP</tspan></text><text x="76" y="147.87" fill="#183139" font-family="Arial, sans-serif" font-size="57" font-weight="700" text-anchor="start" data-box-x="76" data-box-y="96" data-box-w="1450" data-box-h="70"><tspan x="76" dy="0">What we can say now—and test next</tspan></text><text x="80" y="215.3" fill="#62747A" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" data-box-x="80" data-box-y="188" data-box-w="1430" data-box-h="42"><tspan x="80" dy="0">Current evidence supports the components; the proposed comparison must establish adaptation.</tspan></text><line x1="80" y1="844" x2="1520" y2="844" stroke="#D8DFD9" stroke-width="1.5" stroke-linecap="round"/><text x="80" y="876.56" fill="#62747A" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" data-box-x="80" data-box-y="862" data-box-w="1230" data-box-h="23"><tspan x="80" dy="0">ROBOT ADAPTATION  /  PI RESEARCH UPDATE</tspan></text><text x="1520" y="876.29" fill="#62747A" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="end" data-box-x="1390" data-box-y="859" data-box-w="130" data-box-h="28"><tspan x="1520" dy="0">08 / 08</tspan></text><rect x="80" y="284" width="690" height="344" rx="22" fill="#E1EFEB"/><rect x="830" y="284" width="690" height="344" rx="22" fill="#FFFFFF"/><rect x="111" y="313" width="265" height="38" rx="19" fill="#087F7B"/><text x="243.5" y="336.29" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" data-box-x="111" data-box-y="319" data-box-w="265" data-box-h="27"><tspan x="243.5" dy="0">DEMONSTRATED</tspan></text><rect x="861" y="313" width="300" height="38" rx="19" fill="#E8ECE8"/><text x="1011" y="336.29" fill="#62747A" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" data-box-x="861" data-box-y="319" data-box-w="300" data-box-h="27"><tspan x="1011" dy="0">NEXT EXPERIMENT</tspan></text><text x="112" y="419.3" fill="#183139" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" data-box-x="112" data-box-y="392" data-box-w="620" data-box-h="40"><tspan x="112" dy="0">Controlled image-to-mass estimate</tspan></text><text x="112" y="461.66" fill="#62747A" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" data-box-x="112" data-box-y="438" data-box-w="620" data-box-h="35"><tspan x="112" dy="0">2.76 g MAE on held-out cube sizes</tspan></text><text x="112" y="530.3" fill="#183139" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" data-box-x="112" data-box-y="503" data-box-w="620" data-box-h="40"><tspan x="112" dy="0">Estimator-to-policy integration</tspan></text><text x="112" y="572.66" fill="#62747A" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" data-box-x="112" data-box-y="549" data-box-w="620" data-box-h="35"><tspan x="112" dy="0">Three configured full-horizon successes</tspan></text><text x="862" y="419.3" fill="#183139" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" data-box-x="862" data-box-y="392" data-box-w="620" data-box-h="40"><tspan x="862" dy="0">Train across initial object heights</tspan></text><text x="862" y="461.66" fill="#62747A" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" data-box-x="862" data-box-y="438" data-box-w="620" data-box-h="35"><tspan x="862" dy="0">Establish policy capability with true context</tspan></text><text x="862" y="528.48" fill="#183139" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" data-box-x="862" data-box-y="503" data-box-w="620" data-box-h="37"><tspan x="862" dy="0">Evaluate estimated context at held-out heights</tspan></text><text x="862" y="572.66" fill="#62747A" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" data-box-x="862" data-box-y="549" data-box-w="620" data-box-h="35"><tspan x="862" dy="0">Compare against true and fixed inputs</tspan></text><text x="80" y="709.39" fill="#183139" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" data-box-x="80" data-box-y="683" data-box-w="1440" data-box-h="38"><tspan x="80" dy="0">If true context fails: inspect policy capability and task feasibility.</tspan></text><text x="80" y="760.39" fill="#183139" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" data-box-x="80" data-box-y="734" data-box-w="1440" data-box-h="38"><tspan x="80" dy="0">If true context succeeds but estimates fail: inspect estimation and policy sensitivity.</tspan></text><text x="80" y="818.66" fill="#62747A" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" data-box-x="80" data-box-y="795" data-box-w="1440" data-box-h="35"><tspan x="80" dy="0">Later stage: revise environmental estimates through interaction, success, and failure.</tspan></text></svg>