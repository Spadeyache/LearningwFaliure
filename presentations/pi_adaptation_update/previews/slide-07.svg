width="1440" height="57" rx="15" fill="#E8ECE8"/><text x="107" y="314.2" fill="#62747A" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" data-box-x="107" data-box-y="296" data-box-w="450" data-box-h="27"><tspan x="107" dy="0">CONTEXT INPUT</tspan></text><text x="613" y="314.2" fill="#62747A" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" data-box-x="613" data-box-y="296" data-box-w="867" data-box-h="27"><tspan x="613" dy="0">QUESTION</tspan></text><text x="107" y="378.39" fill="#183139" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" data-box-x="107" data-box-y="352" data-box-w="460" data-box-h="38"><tspan x="107" dy="0">True context</tspan></text><text x="613" y="378.39" fill="#183139" font-family="Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-box-x="613" data-box-y="352" data-box-w="867" data-box-h="38"><tspan x="613" dy="0">Can the policy execute at the unseen height?</tspan></text><line x1="105" y1="416" x2="1495" y2="416" stroke="#D8DFD9" stroke-width="1" stroke-linecap="round"/><text x="107" y="455.39" fill="#087F7B" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" data-box-x="107" data-box-y="429" data-box-w="460" data-box-h="38"><tspan x="107" dy="0">Estimated context</tspan></text><text x="613" y="455.39" fill="#183139" font-family="Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-box-x="613" data-box-y="429" data-box-w="867" data-box-h="38"><tspan x="613" dy="0">How much performance is lost to estimation?</tspan></text><line x1="105" y1="493" x2="1495" y2="493" stroke="#D8DFD9" stroke-width="1" stroke-linecap="round"/><text x="107" y="532.39" fill="#183139" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" data-box-x="107" data-box-y="506" data-box-w="460" data-box-h="38"><tspan x="107" dy="0">Fixed / incorrect context</tspan></text><text x="613" y="532.39" fill="#183139" font-family="Arial, sans-serif" font-size="29" font-weight="400" text-anchor="start" data-box-x="613" data-box-y="506" data-box-w="867" data-box-h="38"><tspan x="613" dy="0">Does useful context improve execution?</tspan></text><ellipse cx="100" cy="644" rx="20" ry="20" fill="#087F7B"/><text x="100" y="650.93" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" data-box-x="80" data-box-y="630" data-box-w="40" data-box-h="29"><tspan x="100" dy="0">1</tspan></text><text x="139" y="652.66" fill="#183139" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" data-box-x="139" data-box-y="629" data-box-w="631" data-box-h="37"><tspan x="139" dy="0">Reserve test heights before training.</tspan></text><ellipse cx="850" cy="644" rx="20" ry="20" fill="#087F7B"/><text x="850" y="650.93" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" data-box-x="830" data-box-y="630" data-box-w="40" data-box-h="29"><tspan x="850" dy="0">2</tspan></text><text x="889" y="652.66" fill="#183139" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" data-box-x="889" data-box-y="629" data-box-w="631" data-box-h="37"><tspan x="889" dy="0">Match physical scenes and starts.</tspan></text><ellipse cx="100" cy="751" rx="20" ry="20" fill="#087F7B"/><text x="100" y="757.93" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" data-box-x="80" data-box-y="737" data-box-w="40" data-box-h="29"><tspan x="100" dy="0">3</tspan></text><text x="139" y="759.66" fill="#183139" font-family="Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" data-box-x="139" data-box-y="736" data-box-w="631" data-box-h="37"><tspan x="139" dy="0">Freeze models; predefine held success.</tspan></text><ellipse cx="850" cy="751" rx="20" ry="20" fill="#087F7B"/>